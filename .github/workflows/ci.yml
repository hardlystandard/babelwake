name: Verify Babelwake
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: babelwake-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubicloud-standard-4-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: BABELWAKE_PRODUCTION=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
